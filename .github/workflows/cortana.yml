# The fork's own check (jitwaru2/hindsight, branch `cortana`): lint and the deterministic suite of
# hindsight-ext-cortana, run on every push to `cortana` and every pull request into it. It lives in
# its own file so upstream's workflows stay as released and pulls do not conflict here.
#
# The suite needs no model or credentials: it runs on the engine's own fixtures (an embedded
# PostgreSQL through pg0, the local embedding and reranking models, the mock LLM provider).
# Python 3.11 is the development checkout's interpreter (.python-version at the root); 3.14 is
# the interpreter production's tool environment runs.
name: cortana

on:
  push:
    branches: [cortana]
  pull_request:
    branches: [cortana]
  workflow_dispatch:

concurrency:
  group: cortana-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  extension:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    name: hindsight-ext-cortana (Python ${{ matrix.python }})
    env:
      UV_PYTHON: ${{ matrix.python }}
    defaults:
      run:
        working-directory: ./hindsight-extensions/cortana

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          prune-cache: false

      # Not --frozen: extension locks are not checked in (hindsight-extensions/.gitignore).
      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run deptry .

      - name: Cache HuggingFace models
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-huggingface-${{ hashFiles('hindsight-api-slim/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-huggingface-

      - name: Pre-download models
        run: |
          uv run python -c "
          from sentence_transformers import CrossEncoder, SentenceTransformer
          SentenceTransformer('BAAI/bge-small-en-v1.5')
          CrossEncoder('cross-encoder/ms-marco-MiniLM-L-6-v2')
          "

      - name: Deterministic suite
        run: uv run pytest
